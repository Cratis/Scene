name: JavaScript Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
  pull_request:
    branches:
      - "**"
    paths:
      - "Source/JavaScript/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 23.x
          registry-url: "https://registry.npmjs.org"

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: |
            .yarn/cache
            **/node_modules
            **/.eslintcache
            **/yarn.lock
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/package.json') }}

      - name: Yarn install
        run: yarn

      - name: Build JS/TS
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          yarn ci

      - name: Verify packed packages hold no specifications
        run: yarn verify-packages

      # Every blueprint package must hold to the definition of done (spec Part B 6): verifyBlueprintPackage runs inside each package's own
      # specification, and this checks what a specification cannot see - the real archive, and that blueprintCatalog.json is current.
      - name: Verify blueprint packages
        run: yarn verify-blueprints

      # The generator all domain blueprints start from must keep producing a package that is done, without edits.
      - name: Scaffold a blueprint and verify it
        run: |
          # The cache holds every node_modules folder, including one a previous run left in the scaffold's folder.
          rm -rf Source/JavaScript/blueprint.ci-scaffold
          node ./new-blueprint.js ci-scaffold "CI scaffold" "Proves the blueprint scaffold produces a package that is done."
          yarn
          yarn workspace @cratis/scene.blueprint.ci-scaffold build
          yarn workspace @cratis/scene.blueprint.ci-scaffold lint
          UPDATE_BLUEPRINT_CATALOG=1 yarn workspace @cratis/scene.blueprint.ci-scaffold test
          node ./verify-blueprints.js --write
          grep -q '"domain": "ci-scaffold"' blueprintCatalog.json
          # Leave the checkout as it was found: the scaffold is a proof, not part of the repository (or of the cache).
          rm -rf Source/JavaScript/blueprint.ci-scaffold
          git checkout -- blueprintCatalog.json

      - name: Build Storybook
        run: yarn build-storybook

      # The foundation components are audited in a real Chromium at desktop, tablet and phone widths in both themes,
      # with colour contrast, which jsdom cannot judge (spec Part B 6). A regression fails the build.
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Browser specifications
        run: |
          yarn workspace @cratis/scene.blueprint.default test:browser
          yarn workspace @cratis/scene.blueprint.crm test:browser
          yarn workspace @cratis/scene.blueprint.hr test:browser
          yarn workspace @cratis/scene.blueprint.inventory test:browser
          yarn workspace @cratis/scene.blueprint.administration test:browser
