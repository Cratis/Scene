name: .NET Build

# PR builds run under pull_request and build the PR head. Group by pull request when there is one,
# otherwise by ref, so a newer PR run cancels only the older run for the same pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
  pull_request:
    branches:
      - "**"
    paths:
      - "Source/DotNET/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "Scene.slnx"
      - ".github/workflows/dotnet-build.yml"

# PR builds run with a read-only token, and checkouts do not keep credentials.
# PR runs restore caches but never save them.
permissions:
  contents: read

jobs:
  dotnet-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      spec-projects: ${{ steps.discover-specs.outputs.projects }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Discover spec projects
        id: discover-specs
        run: |
          projects=$(find Source/DotNET -name "*.Specs.csproj" \
            | sed 's|/[^/]*\.csproj$||' \
            | sort \
            | jq -Rc '.' \
            | jq -sc '.')
          echo "projects=$projects" >> "$GITHUB_OUTPUT"

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet packages
        uses: actions/cache/restore@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build --configuration Release

      - name: Archive build output
        run: find . -type d -name bin -not -path '*/node_modules/*' -not -path './.git/*' -print0 | tar --null -czf build-output.tar.gz -T -

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build-output.tar.gz
          retention-days: 1
          if-no-files-found: error

  specs:
    needs: [dotnet-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.dotnet-build.outputs.spec-projects) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Extract build output
        run: tar -xzf build-output.tar.gz

      - name: Test (${{ matrix.project }})
        run: dotnet test ${{ matrix.project }} --no-build --configuration Release
